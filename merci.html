<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merci — AML Shop</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Dancing+Script:wght@600;700&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --rose-dark: #8c3356;
      --rose-hot: #e8357a;
      --pink-pale: #fdf0f5;
      --pink-light: #f5d5e5;
      --text-muted: #8a6070;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Jost', sans-serif;
      background: var(--rose-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .blob { position: fixed; border-radius: 50%; background: rgba(255,255,255,0.04); animation: blobPulse ease-in-out infinite alternate; }
    .blob-1 { width: 500px; height: 500px; top: -150px; right: -150px; animation-duration: 6s; }
    .blob-2 { width: 350px; height: 350px; bottom: -100px; left: -100px; animation-duration: 8s; }
    @keyframes blobPulse { from { transform: scale(1); } to { transform: scale(1.1); } }

    .confetti-piece { position: fixed; width: 10px; height: 10px; top: -20px; border-radius: 2px; animation: confettiFall linear forwards; z-index: 0; }
    @keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity:1; } 80% { opacity:1; } 100% { transform: translateY(110vh) rotate(720deg); opacity:0; } }

    .petal { position: fixed; animation: petalFloat linear infinite; z-index: 0; opacity: 0; }
    @keyframes petalFloat { 0% { transform: translateY(110vh) rotate(0deg); opacity:0; } 10% { opacity:0.8; } 90% { opacity:0.6; } 100% { transform: translateY(-10vh) rotate(360deg); opacity:0; } }

    .card {
      position: relative; z-index: 10; text-align: center;
      padding: 4rem 3rem; max-width: 560px; width: 90%;
      animation: cardEntrance 0.9s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes cardEntrance { from { opacity:0; transform: scale(0.7) translateY(40px); } to { opacity:1; transform: scale(1) translateY(0); } }

    .check-ring {
      width: 100px; height: 100px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 2rem; position: relative;
      animation: ringAppear 0.6s 0.3s ease both;
    }
    .check-ring::before {
      content: ''; position: absolute; inset: -3px; border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--rose-hot); border-right-color: var(--rose-hot);
      animation: ringRotate 1s 0.2s ease forwards;
    }
    @keyframes ringRotate { from { transform: rotate(-90deg); } to { transform: rotate(270deg); } }
    @keyframes ringAppear { from { opacity:0; transform: scale(0); } to { opacity:1; transform: scale(1); } }
    .check-icon { font-size: 2.5rem; animation: checkPop 0.5s 0.8s cubic-bezier(0.34,1.56,0.64,1) both; }
    @keyframes checkPop { from { opacity:0; transform: scale(0) rotate(-30deg); } to { opacity:1; transform: scale(1) rotate(0deg); } }

    .brand { font-family: 'Dancing Script', cursive; font-size: 2.2rem; color: rgba(255,255,255,0.6); margin-bottom: 0.5rem; animation: fadeUp 0.6s 0.9s ease both; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.5rem,7vw,4rem); font-weight: 300; color: white; line-height: 1; margin-bottom: 0.4rem; animation: fadeUp 0.6s 1s ease both; }
    h1 em { font-family: 'Dancing Script', cursive; color: var(--rose-hot); font-style: normal; font-size: 0.75em; display: block; }

    .divider { display: flex; align-items: center; gap: 1rem; margin: 1.8rem auto; max-width: 300px; animation: fadeUp 0.6s 1.1s ease both; }
    .divider-line { flex: 1; height: 1px; background: rgba(255,255,255,0.2); }
    .divider-icon { color: var(--rose-hot); }

    .message { font-size: 1rem; color: rgba(255,255,255,0.75); line-height: 1.9; margin-bottom: 0.5rem; animation: fadeUp 0.6s 1.2s ease both; }
    .snap-tag { display: inline-block; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 0.3rem 1rem; border-radius: 50px; font-size: 0.9rem; margin: 0.8rem 0 1.5rem; animation: fadeUp 0.6s 1.3s ease both; }
    .snap-tag span { color: #FFFC00; }

    .socials { display: flex; justify-content: center; gap: 1rem; margin: 1.5rem 0 2rem; animation: fadeUp 0.6s 1.4s ease both; }
    .social-btn { display: flex; align-items: center; gap: 0.4rem; padding: 0.6rem 1.2rem; border-radius: 50px; font-size: 0.78rem; letter-spacing: 0.08em; text-decoration: none; text-transform: uppercase; font-family: 'Jost', sans-serif; transition: transform 0.2s; border: 1px solid rgba(255,255,255,0.25); color: white; background: rgba(255,255,255,0.08); }
    .social-btn:hover { transform: translateY(-2px); }

    /* ── COUNTDOWN ── */
    .countdown-wrap { animation: fadeUp 0.6s 1.5s ease both; margin-top: 1.5rem; }
    .countdown-text { font-size: 0.82rem; color: rgba(255,255,255,0.5); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.75rem; }
    .countdown-ring-wrap { position: relative; width: 70px; height: 70px; margin: 0 auto 0.75rem; }
    .countdown-ring-wrap svg { transform: rotate(-90deg); }
    .countdown-circle-bg { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 4; }
    .countdown-circle { fill: none; stroke: var(--rose-hot); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 188; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
    .countdown-num { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 400; color: white; }
    .countdown-label { font-size: 0.78rem; color: rgba(255,255,255,0.5); }

    @keyframes fadeUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="card">
    <div class="check-ring"><span class="check-icon">🎀</span></div>
    <div class="brand">AML shop</div>
    <h1>Commande reçue !<em>merci à toi 💕</em></h1>
    <div class="divider"><span class="divider-line"></span><span class="divider-icon">✦</span><span class="divider-line"></span></div>
    <p class="message">Ta commande a bien été enregistrée 🌸<br>On te recontacte très vite sur Snapchat<br>pour confirmer et finaliser ton paiement.</p>
    <div class="snap-tag">👻 <span>stany75o</span></div>
    <div class="socials">
      <a href="https://instagram.com/stvnys_law" target="_blank" class="social-btn">📸 Instagram</a>
      <a href="https://tiktok.com/@aml_shop60" target="_blank" class="social-btn">🎵 TikTok</a>
    </div>

    <div class="countdown-wrap">
      <p class="countdown-text">Redirection vers la boutique dans</p>
      <div class="countdown-ring-wrap">
        <svg width="70" height="70" viewBox="0 0 70 70">
          <circle class="countdown-circle-bg" cx="35" cy="35" r="30"/>
          <circle class="countdown-circle" id="countdown-circle" cx="35" cy="35" r="30"/>
        </svg>
        <div class="countdown-num" id="countdown-num">10</div>
      </div>
      <p class="countdown-label">secondes</p>
    </div>
  </div>

  <script>
    // Confetti
    const colors = ['#e8357a','#f5d5e5','#ffffff','#fdf0f5','#c0527a','#FFFC00','#f8a5c2'];
    function createConfetti() {
      for (let i = 0; i < 80; i++) {
        setTimeout(() => {
          const c = document.createElement('div');
          c.className = 'confetti-piece';
          const size = Math.random() * 10 + 5;
          c.style.cssText = `left:${Math.random()*100}vw;width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${Math.random()*3+2.5}s;animation-delay:${Math.random()*2}s;`;
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 6000);
        }, i * 30);
      }
    }
    const petals = ['🌸','💕','✨','🌷','💗','⭐'];
    for (let i = 0; i < 10; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      p.textContent = petals[Math.floor(Math.random()*petals.length)];
      p.style.cssText = `left:${Math.random()*100}vw;animation-duration:${Math.random()*8+6}s;animation-delay:${Math.random()*5}s;font-size:${Math.random()*1+0.8}rem;`;
      document.body.appendChild(p);
    }
    createConfetti();

    // Countdown
    const total = 10;
    let remaining = total;
    const numEl = document.getElementById('countdown-num');
    const circle = document.getElementById('countdown-circle');
    const circumference = 188;

    function updateCountdown() {
      numEl.textContent = remaining;
      const offset = circumference * (1 - remaining / total);
      circle.style.strokeDashoffset = offset;
      if (remaining <= 0) {
        window.location.href = 'index.html';
      } else {
        remaining--;
        setTimeout(updateCountdown, 1000);
      }
    }

    setTimeout(updateCountdown, 1500);
  </script>
</body>
</html>
